  reason: no-developer-program
  detail: 'Habiteo markets no API: no developer portal, no docs, no OpenAPI, no SDK and no MCP or A2A
    surface exists on any of its hosts, and api.habiteo.com / developer.habiteo.com are DNS wildcards
    that serve the marketing homepage for every path. The only anonymously readable machine contract on
    the domain is the WordPress REST route index at https://www.habiteo.com/wp-json/, from which the OpenAPI
    documents in this repo were derived.'
