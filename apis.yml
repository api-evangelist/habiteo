aid: habiteo
name: Habiteo
description: 'Habiteo is a French PropTech company founded in 2014 in Paris that builds full-web 3D sales
  and marketing technology for new-build real estate. Its products let developers, house builders, commercial-property
  operators and their agencies model a programme in 3D before it is built: 3D floor plans and perspectives,
  virtual tours, drone-based site insertions and neighbourhood views (Modelisation and myHabiteo Studio),
  an interior configurator that lets a buyer choose materials and options in place of a physical showroom
  (Configurateur), a mobile on-site sales unit (Habiteo Truck), and the MegaWidget, a hosted mini-site
  that gathers every 3D asset for a programme behind a single link. myHabiteo is the operator platform
  that binds the 3D layer to commercialisation with a CRM, a reservation module, programme management
  and sales and marketing dashboards. More than 350 developers, including Nexity, Kaufman & Broad and
  Immobiliere 3F, have used the technology. Habiteo was acquired by the French listings portal Bien''ici
  in May 2022 and continues to operate under its own brand. Habiteo publishes no public developer programme,
  no API documentation and no machine-readable API contract for any of these products; the only anonymously
  readable machine surface on its domain is the WordPress REST API behind its marketing site.'
image: https://www.habiteo.com/wp-content/uploads/2017/02/Logo_Habiteo_Hz_Bg-transparent-1.png
