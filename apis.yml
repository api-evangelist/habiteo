- aid: habiteo:json-api-plugin
  name: Habiteo Site JSON API (WordPress JSON API plugin)
  description: >-
    A second, older JSON surface on www.habiteo.com, served by the WordPress "JSON API" plugin at /api/.
    GET https://www.habiteo.com/api/ returns {"status":"ok","json_api_version":"1.1.1","controllers":["core"]}
    and the `core` controller answers get_recent_posts, get_page_index, get_category_index and friends
    at /api/core/<method>/. Probed anonymously on 2026-08-17. Like the wp-json surface this is CMS plumbing,
    not a Habiteo product API, and Habiteo documents neither.
