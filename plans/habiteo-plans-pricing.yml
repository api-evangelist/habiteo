detail: >-
  Habiteo publishes no price list, no plan comparison page and no pricing page in any of its three
  site languages. Commercial terms are set per customer by devis (quotation): the conditions
  générales de vente state that prices are firm for twelve calendar months from signature of the
  devis and are thereafter revised against the SYNTEC index (R1 = R0 x S1/S0), billed 50% on
  invoice receipt and the balance on delivery of the livrables, payable within thirty days.
  The CGV reference a freemium tier of myHabiteo ("offre freemium") giving a single user and a free
  mini-site, but attach no price, quota or limit to it. There is no self-serve signup, no API
  metering and no developer plan — Habiteo sells no API, so there is nothing to price.
