        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  description: La date à laquelle l’objet a été publié, dans le fuseau horaire du site.
                date_gmt:
                  type: string
                  description: La date à laquelle l’objet a été publié, au format GMT.
                slug:
                  type: string
                  description: Un identificateur alphanumérique pour l’objet unique de son type.
                status:
                  type: string
                  enum:
                  - publish
                  - future
                  - draft
                  - pending
                  - private
                  description: Un état nommé pour l’objet.
                password:
                  type: string
                  description: Un mot de passe pour protéger l’accès au contenu et à l’extrait.
                title:
                  type: object
                  description: Le titre pour l’objet.
                content:
                  type: object
                  description: Le contenu pour cet objet.
                author:
                  type: integer
                  description: L’ID pour l’auteur de l’objet.
                excerpt:
                  type: object
                  description: L’extrait pour l’objet.
                featured_media:
                  type: integer
                  description: L’ID du média mis en avant pour l’objet.
                comment_status:
                  type: string
                  enum:
                  - open
                  - closed
                  description: Définit si les commentaires sont ouverts ou non pour cet objet.
                ping_status:
                  type: string
                  enum:
                  - open
                  - closed
                  description: Définit si l’objet peut recevoir un ping ou non.
                format:
                  type: string
                  enum:
                  - standard
                  - aside
                  - chat
                  - gallery
                  - link
                  - image
                  - quote
                  - status
                  - video
                  - audio
                  description: Le format pour l’objet.
                meta:
                  type: object
                  description: Champs métas.
                sticky:
                  type: boolean
                  description: Définit si l’objet doit être traité en tant que contenu épinglé ou non.
                template:
                  type: string
                  enum:
                  - ''
                  description: Le fichier de thème à utiliser pour afficher l’objet.
                categories:
                  type: array
                  items:
                    type: integer
                  description: Les termes assignés à l’objet dans la taxonomie category.
                tags:
                  type: array
                  items:
                    type: integer
                  description: Les termes assignés à l’objet dans la taxonomie post_tag.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPError'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPError'
        '403':
          description: rest_forbidden — the anonymous caller may not perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPError'
        '404':
          description: No route or resource matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPError'
      security:
      - basicAuth: []
      - cookieNonce: []
