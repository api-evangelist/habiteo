deployment_note: >-
  Habiteo ships NO MCP server, remote or local. No /mcp endpoint exists on any Habiteo host, no
  npm or PyPI package publishes one, and no Habiteo page mentions MCP, agents or tool calling.
  The tools below are a CANDIDATE list API Evangelist derived from the operations of the WordPress
  content API on www.habiteo.com — they describe what an MCP server over that surface COULD expose,
  not anything Habiteo runs. NO `MCPServer` pointer is wired into apis.yml for this file, because
  the pointer would assert an agent surface the provider does not serve.
